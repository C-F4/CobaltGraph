# CobaltGraph Configuration File
# Geo-Spatial Watchfloor System
#
# IMPORTANT: This file controls core system behavior
# Edit with care. Invalid values may prevent startup.

[General]

# Auto-delete connections older than X days (0 = never delete)
retention_days = 30

[Network]

# Capture method used by device mode: auto, grey_man, ss
capture_method = auto

# Connection buffer size (recent connections kept in memory)
buffer_size = 100

# Enable device tracking (MAC address → device identification)
enable_device_tracking = true

# Device timeout (seconds) - consider device inactive after this time
device_timeout = 300

[Capture]
# PASSIVE RECONNAISSANCE ONLY - CobaltGraph never sends packets
# All capture methods read existing system state only

# Enable passive neighbor cache discovery
# Reads devices the kernel already knows about from normal network operations
# NEVER sends any packets onto the network
enable_passive_discovery = true

# Passive discovery refresh interval (seconds)
# How often to re-read kernel caches for neighbor discovery
passive_discovery_interval = 30

# Enable BPF filter for promiscuous capture (reduces CPU on busy networks)
enable_bpf_filter = true

# BPF filter expression (standard tcpdump/pcap syntax)
# Default captures TCP/UDP traffic, excludes broadcast noise
bpf_filter = tcp or udp

# Capture timeout (seconds) - for passive cache reads
capture_timeout = 5

[Terminal]
# Terminal UI refresh rate in seconds
terminal_refresh = 1

# Terminal UI theme: dark, light, classic
terminal_theme = dark

[TerminalDashboard]

# Dashboard data refresh rate in seconds
dashboard_refresh_rate = 2.0

# Enable globe visualization in network mode
enable_globe = true

# Connection table row limit
connection_table_limit = 50

# Device discovery panel row limit
device_discovery_limit = 20

# Network topology panel max devices to display
topology_max_devices = 5

[GeoIntelligence]
# Primary geolocation service: ip-api, ipapi
primary_geo_service = ip-api

# Enable geo caching (recommended)
enable_geo_cache = true

# Geo cache TTL in seconds (how long to cache results)
geo_cache_ttl = 86400

[ThreatScoring]

# Threat score threshold for alerts (0.0 - 1.0)
alert_threshold = 0.7

[PassiveFingerprinting]
# Passive OS detection from TTL patterns
enable_os_detection = true

# Advanced p0f integration (requires p0f to be installed)
# p0f provides >90% OS detection accuracy
enable_p0f = false

# Path to IEEE OUI database for expanded MAC vendor resolution
# Download from: http://standards-oui.ieee.org/oui/oui.txt
mac_vendor_db = assets/oui.txt

# Expand network_monitor.py vendor database
# Set to true after downloading OUI database
use_expanded_oui = false

[Export]

# Export file location
export_directory = ./exports

[Features]
# Planned features (not yet implemented)
# Set to true when ready to enable

# Webhook/Slack/Discord alerts
enable_webhooks = false

# Email alerts
enable_email_alerts = false

# Desktop notifications
enable_desktop_notifications = false

[WSL]
# Enable WSL/Windows integration (wsl_recon.py)
enable_wsl_integration = false

# WSL distribution name (empty = default)
wsl_distribution =

[RaspberryPi]
# Raspberry Pi specific settings
# Enable low-power mode (reduces CPU/memory usage)
enable_low_power_mode = false

# Reduce worker threads on Pi (auto-detect by default)
pi_worker_threads = 2
